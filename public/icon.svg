<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12382B" />
      <stop offset="100%" stop-color="#0A1F18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B38E5D" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Server / Telecom Rack Base -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Rack Frame -->
    <rect x="116" y="96" width="280" height="320" rx="20" stroke="url(#goldGrad)" stroke-width="16" />
    
    <!-- Rack Units / Switches -->
    <!-- Unit 1 (Router / Gateway) -->
    <rect x="146" y="132" width="220" height="48" rx="8" fill="#1C4B3B" stroke="#2DD4BF" stroke-width="10" />
    <circle cx="180" cy="156" r="8" fill="#10B981" stroke="none" />
    <circle cx="210" cy="156" r="8" fill="#10B981" stroke="none" />
    <circle cx="240" cy="156" r="8" fill="#10B981" stroke="none" />
    <line x1="280" y1="156" x2="340" y2="156" stroke="#A7F3D0" stroke-width="8" />

    <!-- Unit 2 (Switch 24p) -->
    <rect x="146" y="204" width="220" height="48" rx="8" fill="#1C4B3B" stroke="#2DD4BF" stroke-width="10" />
    <circle cx="180" cy="228" r="8" fill="#10B981" stroke="none" />
    <circle cx="210" cy="228" r="8" fill="#F59E0B" stroke="none" />
    <circle cx="240" cy="228" r="8" fill="#10B981" stroke="none" />
    <line x1="280" y1="228" x2="340" y2="228" stroke="#A7F3D0" stroke-width="8" />

    <!-- Unit 3 (Server / Storage) -->
    <rect x="146" y="276" width="220" height="48" rx="8" fill="#1C4B3B" stroke="#2DD4BF" stroke-width="10" />
    <circle cx="180" cy="300" r="8" fill="#10B981" stroke="none" />
    <circle cx="210" cy="300" r="8" fill="#10B981" stroke="none" />
    <circle cx="240" cy="300" r="8" fill="#10B981" stroke="none" />
    <line x1="280" y1="300" x2="340" y2="300" stroke="#A7F3D0" stroke-width="8" />

    <!-- Unit 4 (UPS / Power Backup) -->
    <rect x="146" y="348" width="220" height="42" rx="8" fill="#0D281E" stroke="url(#goldGrad)" stroke-width="10" />
    <circle cx="180" cy="369" r="7" fill="#F59E0B" stroke="none" />
    <line x1="220" y1="369" x2="330" y2="369" stroke="url(#goldGrad)" stroke-width="8" />
  </g>

  <!-- Network / Waves Signals on top -->
  <path d="M 216 70 Q 256 46 296 70" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 186 46 Q 256 16 326 46" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.7" />
</svg>
